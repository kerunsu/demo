# 报告评分权重与公式（可随时修改，无需改代码）
# 运营说明见 docs/REPORT_SCORING.md
# Demo 四维权重之和应为 100；schema_version 会写入报告 formulaVersion
schema_version: education-training-index-v3-sample-sufficiency-demo
score_boundary: education_training_reference_only

# 教师报告中的训练参考线。它只用于比较本次训练结果，
# 不是年龄常模、百分位或临床标准。
course_goal_score: 70

# 命名按已评分课点、排序按有效作答题数计数；达到阈值后才进入综合表现。
sample_sufficiency:
  minimum_effective_samples:
    naming: 2
    ordering: 5

# --- Demo 四维综合权重（和=100）---
weights:
  attention: 25
  expressiveLanguage: 25
  receptiveLanguage: 25
  ordering: 25

# --- 逐课点教师五级评分（1–5 → 映射到维度）---
teacher_rating:
  min: 1
  max: 5
  scale: 20

# --- 排序：客观正确率与速度为主，教师观察为辅 ---
# accuracy/response 合成客观分；objective/teacher 再合成课点分
interactive_course:
  accuracy_weight: 0.75
  response_weight: 0.25
  objective_weight: 0.70
  teacher_weight: 0.30
  ideal_response_sec: 3.0   # 反应时映射：理想→100
  slow_response_sec: 12.0   # 过慢→0

# --- 能力维度内部权重；缺项时按已有数据重新归一化 ---
dimension_weights:
  receptive:
    naming: 1
    ordering: 1
  expressive:
    naming: 1
  attention:
    automatic: 1.00

# --- 综合得分与任务表现按课程类型平衡，避免题量偏置 ---
course_weights:
  naming: 1
  ordering: 1

# --- 综合评定阈值 ---
grade_thresholds:
  excellent: 85
  good: 70
  fair: 55
  needs_support: 0

# 叙事：rule=规则模板；mock=演示占位；其他值回落 rule（不开 LLM）
narrative_provider: rule  # rule | mock
