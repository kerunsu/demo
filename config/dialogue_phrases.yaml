# 社交课打招呼 / 再见（browser TTS；可按课型覆盖，缺省走 default）
social_greeting_intro:
  social:
    - "你好，我是麦麦。很高兴认识你。"
  default:
    - "你好，我是麦麦。很高兴认识你。"

social_greeting_play:
  social:
    - "我们一起玩吧。"
    - "来，一起玩一会儿吧。"
  default:
    - "我们一起玩吧。"
    - "来，一起玩一会儿吧。"

social_farewell_bye:
  social:
    - "再见啦。"
    - "拜拜，下次见。"
  default:
    - "再见啦。"
    - "拜拜，下次见。"

social_farewell_reply:
  social:
    - "再见，下次见。"
    - "好的，再见啦。"
  default:
    - "再见，下次见。"
    - "好的，再见啦。"

