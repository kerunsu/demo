<!DOCTYPE html>
<html>
<head>
  <title>儿童端</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#FF6B6B"/>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/child.css?v=20260826-child-surface-v2">
  <script src="/static/js/child_kiosk_guard.js?v=20260826-child-surface-v2"></script>
  <script src="/static/js/vendor/socket.io.min.js"></script>
  <!-- 姿态分析相关脚本已注释，待迁移到后端 -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script> -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script> -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script> -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest"></script> -->

</head>
<body>
  <h1>儿童端页面</h1>
  <p id="status">等待中...</p>
  <!-- 姿态模仿的测试 - 已注释，待迁移到后端 -->
  <!-- <div id="poseProgressContainer" style="display: none;">
    <div id="poseProgressBar">0%</div>
  </div> -->
  <video id="childCam" autoplay playsinline muted></video>

  <!-- 待机图片（3秒后显示） -->
  <img id="standbyImage" src="/static/resources/images/UI/FG.png" alt="" />

  <!-- 行为绑定动画（全屏播放） -->
  <video id="behaviorAnimationVideo" playsinline muted preload="auto"></video>

  <!-- 过渡遮罩（用于避免摄像头闪现） -->
  <div id="transitionCover" style="display: none;"></div>
  <!-- 播放区域 -->
  <img id="image" class="course-media-layer" />
  <video id="video" class="course-media-layer" playsinline disablepictureinpicture
         controlslist="nodownload noplaybackrate noremoteplayback" preload="auto"></video>
  <audio id="audio" controlslist="nodownload noplaybackrate noremoteplayback"></audio>
  <iframe id="interactive" class="course-media-layer" frameborder="0"
          sandbox="allow-scripts allow-same-origin" allow="autoplay"></iframe>
  <!-- Hidden A/B staging peers: only promoted after their resource is ready. -->
  <img id="image-staging" class="course-media-layer course-media-layer--staging" aria-hidden="true" />
  <video id="video-staging" class="course-media-layer course-media-layer--staging"
         playsinline disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"
         preload="auto" aria-hidden="true"></video>
  <iframe id="interactive-staging" class="course-media-layer course-media-layer--staging"
          frameborder="0" sandbox="allow-scripts allow-same-origin" allow="autoplay" aria-hidden="true"></iframe>

  <script src="/static/js/common.js"></script>
  <script>
    // Role presence is part of the page bootstrap, not the large course module.
    // This keeps Server routing alive even if a later media/course script fails.
    window.startClientPresenceHeartbeat?.("child", 10000);
    window.socket?.on("connect_error", function (error) {
      const status = document.getElementById("status");
      if (status) status.innerText = "儿童端连接失败，正在自动重试…";
      console.error("儿童端 Socket 连接失败:", error && error.message ? error.message : error);
    });
    window.socket?.on("connect", function () {
      const status = document.getElementById("status");
      if (status && status.innerText.indexOf("连接失败") >= 0) status.innerText = "等待中...";
    });
  </script>
  <script src="/static/js/browser_tts.js?v=20260824-speech-warm-v1"></script>
  <script src="/static/js/audio_player.js?v=20260730-behavior-lock"></script>
  <script src="/static/js/child_dialogue.js?v=20260826-dialogue-runtime-v3"></script>
  <script type="module" src="/static/js/child.js?v=20260826-child-surface-v2"></script>

</body>
</html>
