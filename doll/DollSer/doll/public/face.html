<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器人表情显示页</title>
  <style>
    :root { color-scheme: dark; --text: #fff; --line: rgba(255,255,255,.22); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--text); font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif; }
    .stage { position: relative; width: 100%; height: 100%; background: #000; }
    .media-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 140ms linear; pointer-events: none; }
    .media-layer.active { opacity: 1; }
    .face-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .empty { position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 40px)); padding: 18px 22px; border: 1px solid var(--line); background: #000; text-align: left; }
    .empty strong { display: block; margin-bottom: 10px; font-size: clamp(18px, 2vw, 28px); }
    .empty span { color: rgba(255,255,255,.72); font-size: 14px; line-height: 1.7; }
    .status { position: absolute; z-index: 5; top: 16px; left: 16px; padding: 8px 10px; border: 1px solid var(--line); background: #000; font-size: 12px; }
  </style>
</head>
<body>
  <main class="stage">
    <div id="media-layer-0" class="media-layer">
      <video id="face-video-0" class="face-media" muted playsinline preload="auto"></video>
      <img id="face-image-0" class="face-media" alt="机器人表情" hidden>
    </div>
    <div id="media-layer-1" class="media-layer">
      <video id="face-video-1" class="face-media" muted playsinline preload="auto"></video>
      <img id="face-image-1" class="face-media" alt="机器人表情" hidden>
    </div>
    <div id="empty-state" class="empty">
      <strong>未设置待机表情</strong>
      <span>请把待机素材放入 doll/expressions/idle，动作表情会在播放时自动接管。</span>
    </div>
    <div id="status" class="status">连接中</div>
  </main>

  <script>
    const emptyState = document.getElementById('empty-state');
    const status = document.getElementById('status');
    const slots = [0, 1].map((index) => ({
      root: document.getElementById(`media-layer-${index}`),
      video: document.getElementById(`face-video-${index}`),
      image: document.getElementById(`face-image-${index}`),
      mediaId: '',
      mediaType: '',
      loop: true,
      clipStartSec: 0,
      clipEndSec: 0,
    }));
    const warmedMedia = new Map();
    let activeSlotIndex = -1;
    let currentStateKey = '';
    let renderVersion = 0;

    function clampSeconds(value, fallback = 0) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? Math.max(0, parsed) : fallback;
    }

    function getClip(state = {}) {
      const start = clampSeconds(state.clipStartSec, 0);
      const end = clampSeconds(state.clipEndSec, 0);
      return { start, end: end > start ? end : 0 };
    }

    function resetSlot(slot) {
      slot.root.classList.remove('active');
      slot.video.pause();
      slot.video.removeAttribute('src');
      slot.video.load();
      slot.video.hidden = false;
      slot.image.removeAttribute('src');
      slot.image.hidden = true;
      slot.mediaId = '';
      slot.mediaType = '';
    }

    function applyVideoWindow(slot) {
      const video = slot.video;
      if (!Number.isFinite(video.duration) || video.duration <= 0) return;
      const start = Math.min(slot.clipStartSec, Math.max(0, video.duration - .05));
      const end = slot.clipEndSec > start ? Math.min(slot.clipEndSec, video.duration) : 0;
      if (video.currentTime < start) {
        video.currentTime = start;
      } else if (end > 0 && video.currentTime >= Math.max(start, end - .04)) {
        if (slot.loop) {
          video.currentTime = start;
          video.play().catch(() => {});
        } else {
          video.pause();
          video.currentTime = end;
        }
      }
    }

    slots.forEach((slot) => {
      slot.video.addEventListener('timeupdate', () => applyVideoWindow(slot));
      slot.video.addEventListener('ended', () => {
        if (!slot.loop) return;
        slot.video.currentTime = slot.clipStartSec;
        slot.video.play().catch(() => {});
      });
    });

    function warmMediaLibrary(library = []) {
      library.forEach((media) => {
        if (!media?.url || warmedMedia.has(media.id)) return;
        const source = `${media.url}?v=${encodeURIComponent(media.updatedAt || '')}`;
        if (media.mediaType === 'image') {
          const image = new Image();
          image.src = source;
          warmedMedia.set(media.id, image);
        } else {
          const video = document.createElement('video');
          video.muted = true;
          video.preload = 'auto';
          video.src = source;
          video.load();
          warmedMedia.set(media.id, video);
        }
      });
    }

    function waitForImage(image) {
      if (image.complete && image.naturalWidth > 0) return Promise.resolve();
      return new Promise((resolve, reject) => {
        image.addEventListener('load', resolve, { once: true });
        image.addEventListener('error', () => reject(new Error('图片加载失败')), { once: true });
      });
    }

    function waitForVideo(video) {
      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const timer = setTimeout(resolve, 1200);
        video.addEventListener('canplay', () => { clearTimeout(timer); resolve(); }, { once: true });
        video.addEventListener('error', () => { clearTimeout(timer); reject(new Error('视频加载失败')); }, { once: true });
      });
    }

    async function prepareSlot(slot, media, state) {
      resetSlot(slot);
      const clip = getClip(state);
      slot.mediaId = media.id;
      slot.mediaType = media.mediaType || 'video';
      slot.loop = state.loop !== false;
      slot.clipStartSec = clip.start;
      slot.clipEndSec = clip.end;
      const source = `${media.url}?v=${encodeURIComponent(media.updatedAt || state.updatedAt || '')}`;

      if (slot.mediaType === 'image') {
        slot.video.hidden = true;
        slot.image.hidden = false;
        slot.image.src = source;
        await waitForImage(slot.image);
        return;
      }

      slot.image.hidden = true;
      slot.video.hidden = false;
      slot.video.src = source;
      slot.video.load();
      slot.video.addEventListener('loadedmetadata', () => {
        const start = Math.min(slot.clipStartSec, Math.max(0, slot.video.duration - .05));
        if (start > 0) slot.video.currentTime = start;
      }, { once: true });
      await waitForVideo(slot.video);
      await slot.video.play().catch(() => {});
    }

    function activateSlot(nextIndex) {
      const previousIndex = activeSlotIndex;
      const next = slots[nextIndex];
      next.root.classList.add('active');
      activeSlotIndex = nextIndex;
      emptyState.style.display = 'none';

      if (previousIndex >= 0 && previousIndex !== nextIndex) {
        const previous = slots[previousIndex];
        requestAnimationFrame(() => previous.root.classList.remove('active'));
        setTimeout(() => {
          if (activeSlotIndex !== previousIndex) resetSlot(previous);
        }, 220);
      }
    }

    async function applyFaceState(payload) {
      const face = payload?.face || {};
      const media = face.current || null;
      const state = face.state || {};
      warmMediaLibrary([...(face.library || []), ...(face.idle?.library || [])]);

      if (!media) {
        currentStateKey = '';
        renderVersion += 1;
        slots.forEach((slot) => slot.root.classList.remove('active'));
        setTimeout(() => slots.forEach(resetSlot), 180);
        activeSlotIndex = -1;
        emptyState.style.display = 'block';
        status.textContent = '未设置待机表情';
        return;
      }

      const clip = getClip(state);
      const stateKey = [media.id, media.updatedAt, state.mode, state.loop, clip.start, clip.end].join('|');
      status.textContent = `${state.mode === 'idle' ? '待机' : '动作'} · ${media.fileName}`;
      if (stateKey === currentStateKey) return;

      const version = ++renderVersion;
      const nextIndex = activeSlotIndex === 0 ? 1 : 0;
      try {
        await prepareSlot(slots[nextIndex], media, state);
        if (version !== renderVersion) {
          resetSlot(slots[nextIndex]);
          return;
        }
        currentStateKey = stateKey;
        activateSlot(nextIndex);
      } catch (error) {
        status.textContent = `加载失败 · ${media.fileName}`;
      }
    }

    async function fetchFaceState() {
      try {
        const response = await fetch('/api/face/state', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        await applyFaceState(await response.json());
      } catch (error) {
        status.textContent = '未连接';
      }
    }

    const events = new EventSource('/api/face/events');
    events.addEventListener('face', (event) => {
      try { applyFaceState(JSON.parse(event.data)); } catch (error) { status.textContent = '状态数据无效'; }
    });
    events.addEventListener('open', () => { if (status.textContent === '未连接') status.textContent = '已连接'; });
    events.addEventListener('error', () => { status.textContent = '正在重连'; });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && activeSlotIndex >= 0) {
        const active = slots[activeSlotIndex];
        if (active.mediaType === 'video') active.video.play().catch(() => {});
      }
    });

    fetchFaceState();
    setInterval(fetchFaceState, 5000);
  </script>
</body>
</html>
