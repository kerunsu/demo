# 命名等课：按物品名给短特征说法（颜色或性情，勿硬套颜色）
# 页上下文 / 规则答会优先用这里的短线索
item_cues:
  # 颜色自然：水果 / 小虫 / 颜色鲜明的小动物
  草莓: 红红的草莓
  苹果: 红红的苹果
  香蕉: 黄黄的香蕉
  西瓜: 绿绿的西瓜
  葡萄: 紫紫的葡萄
  青蛙: 绿绿的青蛙
  瓢虫: 红红的瓢虫
  # 性情/体型/可爱：大型哺乳等，勿用「黄黄的狮子」
  狮子: 凶猛的狮子
  老虎: 凶猛的老虎
  羊: 可爱的小羊
  小羊: 可爱的小羊
  猫: 可爱的小猫
  狗: 可爱的小狗
  熊猫: 胖胖的熊猫
  斑马: 条纹的斑马
  大象: 大大的大象
  长颈鹿: 高高的长颈鹿
  兔: 可爱的小兔
  兔子: 可爱的小兔

# paixu 组前缀 → 物体名（程度由 level 数字表达）
ordering_prefixes:
  Circle: 圆
  Square: 方块
  Triangle: 三角
  carrot: 胡萝卜
  pencil: 铅笔
  ruler: 尺子
  train: 火车
  house: 房子
  house-red: 红房子
  apple: 苹果
  cookie: 饼干
  cup: 杯子
