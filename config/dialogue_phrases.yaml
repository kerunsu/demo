# 浏览器 TTS 话术库（挂在 aux.question / praise / hint / 社交打招呼再见 上）
# 课型未命中时回退 default
# 配对/排序表扬与鼓励对齐 DemoRobot App.tsx：
#   MATCHING_CORRECT_FEEDBACK_LINES / ORDERING_CORRECT_FEEDBACK_LINES
#   MATCHING_WRONG_FEEDBACK_LINES / ORDERING_WRONG_FEEDBACK_LINES
#   MATCHING_WRONG_FEEDBACK_WITH_HINT_LINES / ORDERING_WRONG_FEEDBACK_WITH_HINT_LINES
# 社交：social_greeting_* / social_farewell_*（browser 模式走 robot_speak_text，不依赖 MP3）

attention:
  global:
    - "看看麦麦，这里还有一个有趣的任务。"
    - "嗨，回来看看屏幕，我们继续吧。"
    - "麦麦在这里，和我一起完成它吧。"
  default:
    - "看看麦麦，我们继续吧。"

reward:
  global:
    - "你回来得真快，真棒！"
    - "谢谢你认真看回来，我们继续。"
    - "注意力回来啦，做得真好！"
  default:
    - "你回来得真快，真棒！"

question:
  naming:
    - "你知道这是什么吗？"
    - "告诉麦麦，这是什么？"
    - "这个是什么呀？"
    - "你会叫它的名字吗？"
    - "这张图里是什么呀？"
  speech:
    - "你知道这是什么吗？"
    - "告诉麦麦，这是什么？"
    - "这个是什么呀？"
    - "你会叫它的名字吗？"
    - "这张图里是什么呀？"
  onomatopoeia:
    # {name} 由当前课点名/speechTarget 填充（猫→小猫）；缺名时代码兜底
    - "{name}会怎么叫呀？"
    - "学一学{name}的叫声。"
    - "{name}的声音是怎样的？"
  pairing:
    - "找出和这个一样的。"
    - "哪张和这个一样？"
    - "选一张最像这个的。"
    - "找一找，哪张是一样的？"
    - "点和这个相同的那一张。"
    - "哪一张和这个完全一样？"
    - "先看这个，再找一样的。"
  matching:
    - "找出和这个一样的。"
    - "哪张和这个一样？"
    - "选一张最像这个的。"
    - "找一找，哪张是一样的？"
    - "点和这个相同的那一张。"
    - "哪一张和这个完全一样？"
    - "先看这个，再找一样的。"
  # 排序：规则未知时的兜底（禁止「按规则选一选」盖住规则句）
  ordering:
    - "选出对的那张。"
  sequencing:
    - "选出对的那张。"
  # 排序八问（category_rule），与 manifest_io.ORDERING_QUESTION_SLOTS 对齐
  size_bigger:
    - "选出更大的那张。"
  size_smaller:
    - "选出更小的那张。"
  length_longer:
    - "选出更长的那张。"
  length_shorter:
    - "选出更短的那张。"
  height_taller:
    - "选出更高的那张。"
  height_shorter:
    - "选出更矮的那张。"
  count_more:
    - "选出更多的那张。"
  count_less:
    - "选出更少的那张。"
  imitation:
    - "看一看屏幕上的动作图片，请你照着做。"
    - "仔细看看图片里的手和身体，学着做一做。"
    - "请照着这张图片，把动作做出来。"
    - "看清图片上的动作，轮到你来做了。"
  pose:
    - "看一看屏幕上的动作图片，请你照着做。"
    - "仔细看看图片里的手和身体，学着做一做。"
    - "请照着这张图片，把动作做出来。"
    - "看清图片上的动作，轮到你来做了。"
  mimic:
    - "看一看屏幕上的动作图片，请你照着做。"
    - "仔细看看图片里的手和身体，学着做一做。"
    - "请照着这张图片，把动作做出来。"
    - "看清图片上的动作，轮到你来做了。"
  default:
    - "看一看屏幕。"
    - "我们开始吧。"

praise:
  # 模仿：夸动作跟随得像、完成得好；不要回退成命名或配对话术
  mimic:
    - "动作做得真像，太棒了！"
    - "你照着图片做得很准确，真好！"
    - "这个动作完成得很好！"
    - "你模仿得真棒！"
  imitation:
    - "动作做得真像，太棒了！"
    - "你照着图片做得很准确，真好！"
    - "这个动作完成得很好！"
    - "你模仿得真棒！"
  pose:
    - "动作做得真像，太棒了！"
    - "你照着图片做得很准确，真好！"
    - "这个动作完成得很好！"
    - "你模仿得真棒！"
  # 命名：夸认对/说对名字（勿用配对「选对了」）
  naming:
    - "说对了，真棒！"
    - "认得真好！"
    - "名字说对了，真棒！！"
    - "说得真棒！"
    - "你会叫它的名字了，真棒！"
  speech:
    - "说对了，真棒！"
    - "认得真好！"
    - "说对了，真厉害！！"
    - "说得真棒！"
    - "你真厉害！"
  # 拟声：夸叫声学得像/好听
  onomatopoeia:
    - "学得真像，很好！"
    - "叫声学对了，真棒！"
    - "学得真棒！"
    - "声音学得真像，真不错！"
  # DemoRobot MATCHING_CORRECT_FEEDBACK_LINES（配对 / matching）
  pairing:
    - "回答正确，真棒！"
    - "做对了，真棒！"
    - "找对了，很好！"
    - "答对了，继续加油！"
    - "选对了，真不错！"
    - "回答正确，做得好！"
    - "这题答对了，真棒！"
  matching:
    - "回答正确，真棒！"
    - "做对了，真棒！"
    - "找对了，很好！"
    - "答对了，继续加油！"
    - "选对了，真不错！"
    - "回答正确，做得好！"
    - "这题答对了，真棒！"
  # DemoRobot ORDERING_CORRECT_FEEDBACK_LINES（排序 / sequencing）
  ordering:
    - "回答正确，真棒！"
    - "做对了，真棒！"
    - "答对了，很好！"
    - "选对了，真不错！"
    - "这题做对了！"
    - "回答正确，继续加油！"
    - "你答对了，真棒！"
  sequencing:
    - "回答正确，真棒！"
    - "做对了，真棒！"
    - "答对了，很好！"
    - "选对了，真不错！"
    - "这题做对了！"
    - "回答正确，继续加油！"
    - "你答对了，真棒！"
  default:
    - "回答正确，真棒！"
    - "做对了，真棒！"
    - "答对了，很好！"
    - "选对了，真不错！"
    - "回答正确，做得好！"
    - "这题答对了，真棒！"

